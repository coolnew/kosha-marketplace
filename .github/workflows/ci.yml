name: Marketplace CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: python xtask-marketplace.py --root . --check
      - run: python -m unittest test_xtask_marketplace
      - run: python -m unittest discover -s tests

  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check contributed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            python xtask-dco.py "$BASE..HEAD"
          else
            python xtask-dco.py
          fi
